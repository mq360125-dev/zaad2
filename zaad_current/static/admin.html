<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة | ZAAD زاد</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-950 text-slate-100"><main class="mx-auto max-w-7xl px-5 py-8"><div class="flex items-center gap-3"><span class="grid h-10 w-10 place-items-center rounded-xl bg-gradient-to-br from-amber-300 to-amber-600 font-black text-slate-950">زاد</span><span class="font-black text-slate-400">ZAAD</span></div><h1 class="mt-4 text-3xl font-black">لوحة الإدارة</h1><p class="mt-2 text-slate-400">CRUD للمحتوى مع توثيق المصدر. ضع ADMIN_TOKEN في الخادم ثم أدخله هنا.</p><div class="mt-5 flex gap-2"><input id="token" type="password" placeholder="ADMIN_TOKEN" class="flex-1 rounded-xl border border-white/10 bg-white/5 p-3"><button id="login" class="rounded-xl bg-teal-600 px-5 font-bold">دخول</button></div><div id="msg" class="mt-3 text-sm"></div><div id="stats" class="mt-6"></div><section class="mt-8 grid gap-6 lg:grid-cols-3"><form id="platformForm" class="rounded-2xl border border-white/10 bg-white/5 p-5"><h2 class="text-xl font-bold">إضافة منصة</h2><textarea id="platformJson" class="mt-4 h-80 w-full rounded-xl bg-slate-900 p-3 text-xs" spellcheck="false">{
  "slug":"example-platform",
  "name":"Example Platform",
  "description":"Official platform description",
  "official_url":"https://example.com",
  "courses_url":"https://example.com/courses",
  "categories":["Programming"],
  "source_type":"manual",
  "official_source":"https://example.com"
}</textarea><button class="mt-3 w-full rounded-xl bg-teal-600 py-3 font-bold">حفظ المنصة</button></form><form id="courseForm" class="rounded-2xl border border-white/10 bg-white/5 p-5"><h2 class="text-xl font-bold">إضافة كورس</h2><textarea id="courseJson" class="mt-4 h-80 w-full rounded-xl bg-slate-900 p-3 text-xs" spellcheck="false">{
  "slug":"example-course",
  "title":"Example Course",
  "platform_id":1,
  "description":"Official course description",
  "category":"Programming",
  "level":"Beginner",
  "language":"English",
  "free":true,
  "certificate_available":false,
  "price":"Free",
  "financial_aid":false,
  "official_url":"https://example.com/course",
  "source":"https://example.com/course"
}</textarea><button class="mt-3 w-full rounded-xl bg-teal-600 py-3 font-bold">حفظ الكورس</button></form><form id="opportunityForm" class="rounded-2xl border border-white/10 bg-white/5 p-5"><h2 class="text-xl font-bold">إضافة فرصة</h2><textarea id="opportunityJson" class="mt-4 h-80 w-full rounded-xl bg-slate-900 p-3 text-xs" spellcheck="false">{
  "slug":"example-opportunity",
  "type":"scholarship",
  "title":"Example Scholarship",
  "organization":"Unknown",
  "description":"Verified description",
  "country":"Unknown",
  "online":false,
  "category":"Scholarship",
  "funding_type":"Unknown",
  "application_url":"https://example.com/apply",
  "official_source":"https://example.com"
}</textarea><button class="mt-3 w-full rounded-xl bg-teal-600 py-3 font-bold">حفظ الفرصة</button></form></section><section class="mt-8 rounded-2xl border border-white/10 bg-white/5 p-5"><h2 class="text-xl font-bold">عمليات سريعة</h2><div class="mt-4 grid gap-3 md:grid-cols-3"><div class="flex gap-2"><input id="deleteOpp" placeholder="Opportunity ID" class="min-w-0 flex-1 rounded-xl bg-slate-900 p-3"><button onclick="removeItem('/api/admin/opportunities/'+$('deleteOpp').value)" class="rounded-xl bg-red-600 px-4">حذف</button></div><div class="flex gap-2"><input id="deleteCourse" placeholder="Course ID" class="min-w-0 flex-1 rounded-xl bg-slate-900 p-3"><button onclick="removeItem('/api/admin/courses/'+$('deleteCourse').value)" class="rounded-xl bg-red-600 px-4">حذف</button></div><div class="flex gap-2"><input id="verifyOpp" placeholder="Opportunity ID" class="min-w-0 flex-1 rounded-xl bg-slate-900 p-3"><button onclick="verify('/api/admin/opportunities/'+$('verifyOpp').value+'/verification?verified=true')" class="rounded-xl bg-emerald-700 px-4">توثيق</button></div></div></section></main><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'X-Admin-Token':$('token').value,'Content-Type':'application/json'};const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||r.statusText);return d}
async function refresh(){try{const s=await api('/api/admin/stats');$('stats').innerHTML=`<div class="grid gap-3 md:grid-cols-4">${[['platforms','منصات'],['courses','كورسات'],['opportunities','فرص'],['unverified','غير موثق']].map(([k,l])=>`<div class="rounded-2xl border border-white/10 bg-white/5 p-4"><span>${l}</span><b class="mt-2 block text-3xl">${s[k]}</b></div>`).join('')}</div>`;$('msg').textContent='تم الاتصال.';$('msg').className='mt-3 text-sm text-emerald-300'}catch(e){$('msg').textContent=e.message;$('msg').className='mt-3 text-sm text-red-300'}}
async function submit(url,id){try{const body=JSON.parse($(id).value);await api(url,{method:'POST',body:JSON.stringify(body)});$('msg').textContent='تم الحفظ بنجاح';$('msg').className='mt-3 text-sm text-emerald-300';refresh()}catch(e){$('msg').textContent=e.message;$('msg').className='mt-3 text-sm text-red-300'}}
async function removeItem(url){try{await api(url,{method:'DELETE'});$('msg').textContent='تم الحذف';refresh()}catch(e){$('msg').textContent=e.message}}
async function verify(url){try{await api(url,{method:'PATCH'});$('msg').textContent='تم التوثيق';refresh()}catch(e){$('msg').textContent=e.message}}
$('login').onclick=refresh;$('platformForm').onsubmit=e=>{e.preventDefault();submit('/api/admin/platforms','platformJson')};$('courseForm').onsubmit=e=>{e.preventDefault();submit('/api/admin/courses','courseJson')};$('opportunityForm').onsubmit=e=>{e.preventDefault();submit('/api/admin/opportunities','opportunityJson')};
</script></body></html>
