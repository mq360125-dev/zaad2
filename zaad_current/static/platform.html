<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المنصة | ZAAD زاد</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E"><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-950 text-slate-100"><main class="mx-auto max-w-6xl px-5 py-8 sm:py-12"><a href="/" class="text-teal-300">← العودة للدليل</a><div id="content" class="mt-8">جارٍ تحميل المنصة...</div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); const yes=v=>v?'نعم':'غير معلن';
const link=(url,label)=>url?`<a target="_blank" rel="noopener" class="rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-sm font-bold hover:bg-white/10" href="${esc(url)}">${label} ↗</a>`:'';
(async()=>{const slug=location.pathname.split('/').filter(Boolean).pop(); const r=await fetch('/api/platforms/'+encodeURIComponent(slug)); if(!r.ok){document.getElementById('content').innerHTML='<p>المنصة غير موجودة.</p>';return;} const p=await r.json(); document.title=p.name+' | ZAAD زاد';
const courseCards=p.courses.map(c=>`<article class="rounded-2xl border border-white/10 bg-white/5 p-5"><div class="flex items-center justify-between gap-3"><span class="text-xs text-emerald-300">${c.verified?'✓ موثق':'يحتاج تحقق'}</span><span class="text-xs text-slate-400">${esc(c.category)}</span></div><h3 class="mt-3 text-lg font-bold">${esc(c.title)}</h3><p class="mt-2 text-sm leading-6 text-slate-400">${esc(c.description)}</p><div class="mt-4 flex flex-wrap gap-2 text-xs text-slate-400"><span>${c.free?'🆓 مجاني':'💳 مدفوع/حسب العرض'}</span><span>${c.certificate_available?'🏅 '+esc(c.certificate_type||'شهادة'):''}</span></div><a target="_blank" rel="noopener" class="mt-4 inline-block text-teal-300" href="${esc(c.official_url)}">فتح الكورس الرسمي ←</a></article>`).join('');
const oppCards=p.opportunities.map(o=>`<article class="rounded-2xl border border-white/10 bg-white/5 p-5"><span class="text-xs text-teal-300">${esc(o.type)}</span><h3 class="mt-2 text-lg font-bold">${esc(o.title)}</h3><p class="mt-2 text-sm leading-6 text-slate-400">${esc(o.description)}</p><div class="mt-4 flex flex-wrap gap-2 text-xs text-slate-400"><span>${esc(o.country||'Global')}</span>${o.deadline?`<span>⏳ ${esc(o.deadline)}</span>`:''}${o.funding_type?`<span>💰 ${esc(o.funding_type)}</span>`:''}</div><a class="mt-4 inline-block text-teal-300" href="/opportunity/${o.id}">عرض كل التفاصيل ←</a></article>`).join('');
document.getElementById('content').innerHTML=`<section class="rounded-3xl border border-white/10 bg-white/5 p-7 sm:p-10"><div class="flex flex-wrap items-start justify-between gap-6"><div class="max-w-3xl"><span class="rounded-full bg-teal-500/15 px-4 py-2 text-sm text-teal-300">🏛️ منصة تعليمية</span><h1 class="mt-5 text-4xl font-black sm:text-6xl">${esc(p.name)}</h1><p class="mt-3 text-slate-400">${esc(p.country||'Global')}</p><p class="mt-6 leading-8 text-slate-300">${esc(p.description)}</p></div><a target="_blank" rel="noopener" href="${esc(p.official_url)}" class="rounded-xl bg-gradient-to-l from-amber-300 to-amber-600 px-6 py-3 font-bold text-slate-950">التوجه للمنصة ↗</a></div><div class="mt-8 grid gap-3 sm:grid-cols-2 lg:grid-cols-4"><div class="rounded-xl bg-white/5 p-4"><div class="text-xs text-slate-500">محتوى مجاني</div><div class="mt-1 font-bold">${yes(p.free_courses_available)}</div></div><div class="rounded-xl bg-white/5 p-4"><div class="text-xs text-slate-500">شهادات</div><div class="mt-1 font-bold">${yes(p.certificates_available)}</div></div><div class="rounded-xl bg-white/5 p-4"><div class="text-xs text-slate-500">مساعدة مالية</div><div class="mt-1 font-bold">${yes(p.financial_aid_available)}</div></div><div class="rounded-xl bg-white/5 p-4"><div class="text-xs text-slate-500">آخر تحقق</div><div class="mt-1 font-bold">${esc(p.last_checked)}</div></div></div></section>
<section class="mt-6 rounded-3xl border border-emerald-400/20 bg-emerald-500/5 p-7"><h2 class="text-2xl font-black">🆓 طريقة الحصول على المجاني</h2><p class="mt-4 max-w-4xl leading-8 text-slate-300">${esc(p.free_access_guide||'ابدأ من الرابط الرسمي، اختر المحتوى المجاني إن كان معلنًا، وسجّل الدخول إذا طلب منك ذلك. لا تعتبر الشهادة مجانية إلا إذا نص المصدر الرسمي على ذلك.')}</p><p class="mt-4 text-sm text-emerald-300">مهم: المحتوى المجاني والشهادة المجانية ليسا الشيء نفسه دائمًا.</p></section>
<section class="mt-6 rounded-3xl border border-white/10 bg-white/5 p-7"><h2 class="text-2xl font-black">كل الروابط الرسمية</h2><div class="mt-5 flex flex-wrap gap-3">${link(p.official_url,'الموقع الرسمي')}${link(p.courses_url,'الكورسات')}${link(p.certificates_url,'الشهادات')}${link(p.scholarships_url,'المنح')}${link(p.volunteering_url,'التطوع')}</div><p class="mt-5 text-xs text-slate-500">المصدر: ${esc(p.official_source)} · ${esc(p.source_type)} · ${p.verified?'Verified':'Needs verification'}</p></section>
<section class="mt-8"><div class="flex items-center justify-between"><h2 class="text-2xl font-black">الكورسات (${p.course_count})</h2></div><div class="mt-4 grid gap-4 md:grid-cols-2">${courseCards||'<p class="text-slate-400">لا توجد كورسات مرتبطة حاليًا.</p>'}</div></section>
<section class="mt-8"><h2 class="text-2xl font-black">الفرص والمنح المرتبطة (${p.opportunity_count})</h2><div class="mt-4 grid gap-4 md:grid-cols-2">${oppCards||'<p class="text-slate-400">لا توجد فرص مرتبطة بهذه المنصة حاليًا.</p>'}</div></section>`;})();
</script></body></html>
